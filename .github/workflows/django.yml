name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r server/requirements.txt
    - name: Run Flake8 Linter
      run: |
        flake8 server/djangoapp --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 server/djangoapp --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run Django Migrations & Check
      run: |
        python server/manage.py makemigrations
        python server/manage.py migrate
        python server/manage.py check
